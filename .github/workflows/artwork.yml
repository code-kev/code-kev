name: Inkdesk verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  artwork-check:
    name: artwork-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the proposed artwork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes ffmpeg
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify published assets and animation
        run: npm run check
