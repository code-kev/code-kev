name: Profile verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artwork-check:
    name: artwork-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit verifier dependencies
        run: npm audit --audit-level=high
      - name: Test the verifier
        run: npm test
      - name: Verify published profile assets
        run: npm run check
